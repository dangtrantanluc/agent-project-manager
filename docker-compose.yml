services:
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema hợp nhất (source of truth) + seed demo. Init chỉ chạy khi volume rỗng.
      - ./init/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./init/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      # Role read-only cho AI agent (chạy sau schema). Đổi mật khẩu trong file trước prod.
      - ./init/agent_role.sql:/docker-entrypoint-initdb.d/003-agent-role.sql:ro
      # Migrations idempotent (an toàn chạy lại): notifications + mã liên kết Gapo.
      - ./init/notifications.sql:/docker-entrypoint-initdb.d/004-notifications.sql:ro
      - ./init/gapo_link_codes.sql:/docker-entrypoint-initdb.d/005-gapo-link-codes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_pm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agent_pm
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173,http://localhost:80}"
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-dev-agent-token}
      AGENT_USER_EMAIL: ${AGENT_USER_EMAIL:-pm-agent@bluebolt.local}
      PYTHONPATH: /app
      # MinIO object storage cho avatar. Endpoint nội bộ (container-to-container).
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
      MINIO_SECURE: "false"
      # URL công khai trình duyệt dùng để tải ảnh (qua port S3 expose ra host).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
      
  9router:
    image: decolua/9router:latest
    container_name: 9router
    ports:
      - "20128:20128"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DEBUG=true
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_server
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Khởi tạo bucket 'avatars' và đặt quyền public-read một lần rồi thoát.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-avatars} &&
      mc anonymous set download local/${MINIO_BUCKET:-avatars} &&
      echo 'MinIO bucket ${MINIO_BUCKET:-avatars} sẵn sàng (public-read)';
      "

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  minio_data:
