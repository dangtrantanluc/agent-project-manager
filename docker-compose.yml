services:
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema hợp nhất (source of truth) + seed demo. Init chỉ chạy khi volume rỗng.
      - ./init/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./init/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_pm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agent_pm
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173,http://localhost:80}"
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-dev-agent-token}
      AGENT_USER_EMAIL: ${AGENT_USER_EMAIL:-pm-agent@bluebolt.local}
      PYTHONPATH: /app
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
  9router:
    image: decolua/9router:latest
    container_name: 9router
    ports:
      - "20128:20128"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DEBUG=true
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  redis_data:
